<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 第一视角动物互动候选审核</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#1f2937;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.bar{position:sticky;top:0;z-index:3;background:#111827;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h1{font-size:17px;margin:0 18px 0 0}.bar button,.bar select{font:inherit;border:0;border-radius:5px;padding:7px 10px;cursor:pointer}.bar button{background:#374151;color:#fff}.bar button.active{background:#2563eb}.count{margin-left:auto;font-size:13px}.layout{display:grid;grid-template-columns:minmax(560px,1.5fr) minmax(320px,.8fr);gap:14px;padding:14px;max-width:1500px;margin:auto}.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px #0002;padding:12px}.video-wrap{background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center;min-height:360px}.video-wrap video{width:100%;max-height:72vh;background:#000}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:13px;margin-top:10px}.meta div{overflow-wrap:anywhere}.label{color:#6b7280}.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.flag{background:#fee2e2;color:#991b1b;border-radius:4px;padding:3px 6px;font-size:12px}.flag.ok{background:#dcfce7;color:#166534}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.actions button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:12px 4px;cursor:pointer;color:#fff}.keep{background:#15803d}.recut{background:#b45309}.drop{background:#b91c1c}.unsure{background:#4b5563}.actions button:disabled{opacity:.45;cursor:not-allowed}.nextrow{display:flex;gap:8px;margin-top:8px}.nextrow button{flex:1;font:inherit;border:1px solid #d1d5db;background:#fff;border-radius:5px;padding:8px;cursor:pointer}.field{margin-top:11px}.field label{display:block;font-size:13px;color:#4b5563;margin-bottom:4px}.field input,.field textarea{width:100%;font:inherit;border:1px solid #d1d5db;border-radius:5px;padding:7px}.field textarea{height:68px;resize:vertical}.hint{font-size:12px;color:#6b7280;line-height:1.5}.status{font-size:13px;padding:8px;background:#eff6ff;border-radius:5px;margin-bottom:10px}.queue{max-height:55vh;overflow:auto;border:1px solid #e5e7eb;border-radius:5px}.qrow{display:flex;gap:7px;padding:7px 8px;border-bottom:1px solid #eee;font-size:12px;cursor:pointer}.qrow:hover{background:#f9fafb}.qrow.current{background:#dbeafe}.qrow.done{opacity:.55}.qtitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qtime{color:#6b7280;white-space:nowrap}.titleline{display:flex;gap:8px;align-items:center}.titleline h2{font-size:16px;margin:0}.source{font-size:12px;color:#6b7280;overflow-wrap:anywhere;margin-top:4px}.warning{color:#92400e;background:#fffbeb;padding:8px;border-radius:5px;font-size:12px;line-height:1.45;margin-top:10px}.hidden{display:none}
</style>
</head>
<body>
<div class="bar"><h1>H3 互动视频审核</h1><button data-filter="risk" class="active">先看风险</button><button data-filter="all">全部</button><button data-filter="sample">普通抽查</button><button id="prev">上一条 ←</button><button id="next">下一条 →</button><span class="count" id="count">载入中…</span></div>
<div class="layout"><main class="card"><div class="titleline"><h2 id="title">—</h2><span id="decisionBadge"></span></div><div class="source" id="source">—</div><div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video></div><div class="meta"><div><span class="label">原片时间：</span><span id="time">—</span></div><div><span class="label">时长：</span><span id="duration">—</span></div><div><span class="label">组成候选：</span><span id="components">—</span></div><div><span class="label">状态：</span><span id="state">—</span></div></div><div class="flags" id="flags"></div><div class="warning">当前文件仍是机械候选（motion_proposal）。按钮只记录人工意见，不会自动进入关键点检测或训练。遇到一个窗口含多个动作时请选择“重剪”，填入完整时间范围；不要为了配合时长把两个动作硬合在一起。</div><div class="field"><label>重剪开始（秒，可选）</label><input id="recutStart" inputmode="decimal"></div><div class="field"><label>重剪结束（秒，可选）</label><input id="recutEnd" inputmode="decimal"></div><div class="field"><label>备注（可选）</label><textarea id="note" placeholder="例如：摸猫耳朵，猫回头；前半段多余，保留 12.4–17.8 秒"></textarea></div><div class="actions"><button class="keep" data-decision="keep">保留 K</button><button class="recut" data-decision="recut">重剪 R</button><button class="drop" data-decision="delete">删除 D</button><button class="unsure" data-decision="unsure">不确定 U</button></div><div class="nextrow"><button id="skip">跳过，暂不决定 Space</button><button id="openFolder">复制当前文件名</button></div><p class="hint">快捷键：K 保留，R 重剪，D 删除，U 不确定；←/→ 切换。视频播放时空格由播放器接管，暂停后按 Space 跳过。</p></main>
<aside class="card"><div class="status" id="status">—</div><div class="hint" style="margin-bottom:8px">建议顺序：先看风险队列；每个原片只需快速确认一次。普通候选用“普通抽查”，发现同类错误再切回全部。</div><div class="queue" id="queue"></div></aside></div>
<script>
let data=[], decisions={}, filter='risk', visible=[], pos=0, current=null;
const $=id=>document.getElementById(id);
async function load(){const m=await (await fetch('review_manifest.json')).json(); data=m.items||[]; const d=await (await fetch('/api/decisions')).json(); decisions=d.latest||{}; setFilter('risk');}
function latest(i){return decisions[i.id]||null}
function setFilter(f){filter=f; document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f)); visible=data.filter(i=>f==='all'||(f==='risk'&&i.risk)||(f==='sample'&&!i.risk&&i.event_index===Math.min(...data.filter(x=>x.source_id===i.source_id&&!x.risk).map(x=>x.event_index)))); visible.sort((a,b)=>(a.source_id+a.event_index).localeCompare(b.source_id+b.event_index)); pos=Math.max(0,Math.min(pos,visible.length-1)); renderQueue(); render();}
function renderQueue(){const q=$('queue');q.innerHTML='';visible.forEach((i,n)=>{const r=document.createElement('div');r.className='qrow'+(i===current?' current':'')+(latest(i)?' done':'');r.innerHTML=`<span class="qtitle">${n+1}. ${i.source_id} #${i.event_index}</span><span class="qtime">${i.duration_s.toFixed(1)}s</span>`;r.onclick=()=>{pos=n;render()};q.appendChild(r)});}
function render(){current=visible[pos];if(!current){$('title').textContent='没有待审核项目';return}const d=latest(current);$('title').textContent=`${current.source_id} · ${String(current.event_index).padStart(4,'0')}`;$('source').textContent=current.source_path||'';$('time').textContent=`${current.start_s.toFixed(3)} – ${current.end_s.toFixed(3)} s`;$('duration').textContent=`${current.duration_s.toFixed(3)} s`;$('components').textContent=current.components.length?current.components.join(', '):'单候选';$('state').textContent=current.state;$('video').src=current.video_path;$('video').load();$('flags').innerHTML=(current.flags.length?current.flags.map(x=>`<span class="flag">${x}</span>`).join(''):'<span class="flag ok">普通候选</span>');$('recutStart').value=d&&d.recut_start_s!=null?d.recut_start_s:'';$('recutEnd').value=d&&d.recut_end_s!=null?d.recut_end_s:'';$('note').value=d&&d.note?d.note:'';$('decisionBadge').textContent=d?`[${d.decision}]`:'';$('decisionBadge').style.color=d?(d.decision==='keep'?'#15803d':d.decision==='delete'?'#b91c1c':'#b45309'):'';$('count').textContent=`${pos+1}/${visible.length} · 已记录 ${Object.keys(decisions).length}/${data.length}`;$('status').textContent=`当前队列 ${filter==='risk'?'风险':filter==='sample'?'普通抽查':'全部'}：${visible.length} 条；已记录 ${Object.keys(decisions).length} 条`;document.querySelectorAll('.qrow').forEach((e,n)=>e.classList.toggle('current',n===pos));}
async function decide(kind){if(!current)return;const a=parseFloat($('recutStart').value),b=parseFloat($('recutEnd').value);if(kind==='recut'&&(!(b>a)||a<0||b>current.end_s+0.001)){alert('重剪必须填写有效的原片时间范围，且不能超出当前候选窗口。');return}const payload={clip_id:current.id,source_id:current.source_id,event_index:current.event_index,decision:kind,recut_start_s:Number.isFinite(a)?a:null,recut_end_s:Number.isFinite(b)?b:null,note:$('note').value.trim(),at:new Date().toISOString()};const res=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok){alert('保存失败，请检查审核服务窗口是否仍在运行。');return}decisions[current.id]=payload;renderQueue();if(pos<visible.length-1)pos++;render();}
function move(n){pos=Math.max(0,Math.min(visible.length-1,pos+n));render()}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decide(b.dataset.decision));$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('skip').onclick=()=>move(1);$('openFolder').onclick=()=>{navigator.clipboard?.writeText(current?.video_name||'');};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if(k==='k')decide('keep');else if(k==='r')decide('recut');else if(k==='d')decide('delete');else if(k==='u')decide('unsure');else if(k==='arrowleft')move(-1);else if(k==='arrowright'||k===' ') {e.preventDefault();move(1)}});load().catch(e=>{$('status').textContent='载入失败：'+e});
</script>
</body></html>
